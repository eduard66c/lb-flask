    #     # Login to Helm OCI
    #     gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin ${{ env.REGION }}-docker.pkg.dev
        
    #     # Package and Push Chart (OCI)
    #     helm package ./charts/my-flaskapp-chart
    #     helm push my-flaskapp-chart-*.tgz oci://${{ env.REGISTRY_URL }}
        
