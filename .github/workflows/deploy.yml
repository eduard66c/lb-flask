    #     helm upgrade --install fastapi-release oci://${{ env.REGISTRY_URL }}/my-flaskapp-chart \
    #       --set image.repository="${{ env.REGISTRY_URL }}/flask-app" \
    #       --set image.tag="${{ env.IMAGE_TAG }}" \
    #       --wait